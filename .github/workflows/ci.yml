name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Type check + unit tests ─────────────────────────────────────────────────
  check:
    name: Type Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: npx vitest run --coverage
        env:
          VITE_GEMINI_API_KEY: test-key
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── Production build ─────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (with bundle analyzer)
        run: npm run analyze
        # `analyze` is a thin wrapper that runs `vite build` with ANALYZE=1.
        # Output: same dist/ as `npm run build` + dist/stats.html for inspection.
        # Single build for both jobs — no duplicate work.
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'placeholder' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_RC_APPLE_API_KEY: ${{ secrets.VITE_RC_APPLE_API_KEY || '' }}
          VITE_RC_GOOGLE_API_KEY: ${{ secrets.VITE_RC_GOOGLE_API_KEY || '' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || '' }}

      - name: i18n symmetry check
        run: npm run check:i18n

      - name: i18n orphan keys (strict)
        run: npm run check:i18n:orphans:strict
        # Sprint E [1.5.217] — fails CI if any i18n key is declared but never
        # referenced. Sprint B [1.5.213] cleared the baseline to 0; this gate
        # keeps it there. False positives go to scripts/check-i18n-orphans.mjs
        # (dynamic-access pattern detection lives in the ancestor heuristic).

      - name: Bundle size budget
        run: npm run size:check

      - name: Upload bundle stats
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-stats
          path: dist/stats.html
          retention-days: 14

      - name: Capacitor sync check
        run: npx cap sync android
        # Verifies Capacitor plugin compatibility after every production build.
        # Catches native plugin mismatches before they surface in App Store submissions.
        # Requires only dist/ (built above) + android/ (tracked in git).
        # No Android SDK needed — validates the JS+config layer only.

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ─── E2E tests (on PRs and main) ─────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run E2E tests
        run: npx playwright test --project=mobile-chrome
        env:
          VITE_GEMINI_API_KEY: test-key
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:code
